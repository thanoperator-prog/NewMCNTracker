<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MCN Event Tracker</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-512.png">
    
    <!-- Default Icons / Logos -->
    <link rel="icon" type="image/png" href="icon-512.png">
    <link rel="shortcut icon" href="icon-512.png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#312e81',
                            950: '#1e1b4b',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- HTML2PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <!-- React & ReactDOM & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; overscroll-behavior-y: none; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background-color: #94a3b8; }
        
        /* Animation utilities */
        .fade-in { animation: fadeIn 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .slide-in { animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideIn { from { transform: translateX(-100%); } to { transform: translateX(0); } }
    </style>
</head>
<body class="text-slate-800 antialiased selection:bg-brand-100 selection:text-brand-900">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        // Using stable version 10.13.1
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-analytics.js";
        import { 
            getAuth, 
            onAuthStateChanged, 
            signInAnonymously
        } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            updateDoc, 
            deleteDoc, 
            doc, 
            onSnapshot, 
            serverTimestamp,
            query,
            getDocs,
            writeBatch,
            setDoc,
            getDoc,
            enableIndexedDbPersistence
        } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";
        
        // Import Lucide Icons
        import { 
            LayoutDashboard, Calendar as CalendarIcon, FileBarChart, Settings, Plus, Search, 
            Trash2, Edit2, X, Check, Filter, User, LogOut, Save, Users, Database, Briefcase, 
            MapPin, Monitor, AlertTriangle, RefreshCw, Eye, EyeOff, Lock, ChevronRight, 
            Download, Upload, ChevronDown, ShieldAlert, AlertCircle, CalendarDays, ListFilter, 
            Clock, Printer, FileText, Smartphone, Menu, Wifi, WifiOff, UserCheck, ArrowUpDown,
            Coffee, BarChart2, CalendarX, Zap, CheckCircle2
        } from 'https://esm.sh/lucide-react@0.263.1';

        // --- Firebase Init ---
        const firebaseConfig = {
            apiKey: "AIzaSyDC26LzBfrrhN5CBWRgxKzbEQxdVr98sm8",
            authDomain: "mcn-tracker-v2.firebaseapp.com",
            projectId: "mcn-tracker-v2",
            storageBucket: "mcn-tracker-v2.firebasestorage.app",
            messagingSenderId: "502096110892",
            appId: "1:502096110892:web:54ff013cd544ef253a7889",
            measurementId: "G-VPLX6DSQVF"
        };
        
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'mcn-tracker-v1'; 
        
        enableIndexedDbPersistence(db).catch((err) => {
            if (err.code == 'failed-precondition') {
                console.warn('Persistence failed: Multiple tabs open.');
            } else if (err.code == 'unimplemented') {
                console.warn('Persistence not supported by browser.');
            }
        });

        // --- Constants & Helper Functions ---
        const ADMIN_ROLES = ['Super Admin', 'Supervisor', 'Live Operator Lead', 'Live Operator Trainer'];

        const checkIsAdmin = (user) => {
            if (!user || !user.role) return false;
            return ADMIN_ROLES.includes(user.role);
        };

        const getManilaToday = () => new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Manila' });
        const getManilaMonth = () => new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Manila' }).slice(0, 7);

        const formatDateForDisplay = (dateStr, timeStr) => {
            if (!dateStr) return '-';
            const [year, month, day] = dateStr.split('-').map(Number);
            const [hour, minute] = (timeStr || '00:00').split(':').map(Number);
            const d = new Date(year, month - 1, day, hour, minute);
            return d.toLocaleDateString('en-US', { month: '2-digit', day: '2-digit', year: 'numeric' }) + 
                   ' ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
        };

        const getDayName = (dateStr) => {
            if (!dateStr) return '-';
            const d = new Date(dateStr);
            return d.toLocaleDateString('en-US', { weekday: 'long' });
        };

        const getStatusColor = (status) => {
            switch (status) {
                case 'Confirm': return 'bg-emerald-100 text-emerald-700 border-emerald-200 ring-1 ring-emerald-200/50';
                case 'Pending': return 'bg-amber-100 text-amber-700 border-amber-200 ring-1 ring-amber-200/50';
                case 'Cancelled': return 'bg-rose-100 text-rose-700 border-rose-200 ring-1 ring-rose-200/50';
                case 'Done': return 'bg-blue-100 text-blue-700 border-blue-200 ring-1 ring-blue-200/50';
                default: return 'bg-slate-100 text-slate-700 border-slate-200';
            }
        };

        const getCompanyColor = (company) => {
            if (company === 'MCom') return 'text-orange-600';
            if (company === 'StarTok') return 'text-purple-600';
            if (company === 'Sync') return 'text-cyan-600';
            return 'text-slate-600';
        };

        const getNickname = (fullName, team) => {
            if (!team || !fullName) return fullName;
            const member = team.find(t => t.name === fullName);
            return member ? member.nickname : fullName;
        };

        const groupMembersByRole = (members) => {
            const groups = {};
            members.forEach(m => {
                if (!groups[m.role]) groups[m.role] = [];
                groups[m.role].push(m);
            });
            return Object.keys(groups).sort().map(role => ({
                role,
                members: groups[role].sort((a, b) => a.name.localeCompare(b.name))
            }));
        };

        // --- Components ---

        const PasswordInput = ({ value, onChange, placeholder = "Enter password", className }) => {
            const [show, setShow] = React.useState(false);
            return (
                <div className="relative">
                    <input 
                        type={show ? "text" : "password"}
                        value={value}
                        onChange={onChange}
                        className={`${className} pr-10`}
                        placeholder={placeholder}
                    />
                    <button type="button" onClick={() => setShow(!show)} className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-brand-600 transition-colors">
                        {show ? <EyeOff size={18} /> : <Eye size={18} />}
                    </button>
                </div>
            );
        };

        const ConfirmationModal = ({ isOpen, onClose, onConfirm, title, message, isDelete = false }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[70] flex items-center justify-center p-4 fade-in">
                    <div className="bg-white rounded-3xl shadow-2xl w-full max-w-sm overflow-hidden transform transition-all scale-100 border border-white/20">
                        <div className="p-6">
                            <div className={`flex items-center gap-3 mb-4 ${isDelete ? 'text-rose-600' : 'text-amber-600'}`}>
                                <div className={`p-3 rounded-2xl ${isDelete ? 'bg-rose-50' : 'bg-amber-50'}`}><AlertCircle size={24} /></div>
                                <h3 className="text-xl font-bold text-slate-800 tracking-tight">{title || "Confirm Action"}</h3>
                            </div>
                            <p className="text-slate-600 mb-8 text-sm leading-relaxed font-medium">{message}</p>
                            <div className="flex gap-3">
                                <button onClick={onClose} className="flex-1 px-4 py-3 border border-slate-200 rounded-xl text-slate-600 font-bold hover:bg-slate-50 transition-colors">Cancel</button>
                                <button onClick={onConfirm} className={`flex-1 px-4 py-3 text-white rounded-xl font-bold shadow-lg shadow-indigo-200 transition-all active:scale-95 ${isDelete ? 'bg-rose-600 hover:bg-rose-700' : 'bg-brand-600 hover:bg-brand-700'}`}>Confirm</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const SecurityModal = ({ isOpen, onClose, onConfirm, actionType }) => {
            const [password, setPassword] = React.useState('');
            const [error, setError] = React.useState('');
            if (!isOpen) return null;
            const handleSubmit = (e) => {
                e.preventDefault();
                if (!password) { setError('Password is required'); return; }
                onConfirm(password, (isValid) => {
                    if (isValid) { setPassword(''); setError(''); onClose(); } else { setError('Incorrect password'); }
                });
            };
            const getModalContent = () => {
                switch (actionType) {
                    case 'reset': return { title: 'Factory Reset', message: 'WARNING: This will delete ALL event data permanently.', color: 'rose', icon: AlertTriangle };
                    case 'restore': return { title: 'Restore Data', message: 'Restoring will overwrite your current configuration.', color: 'brand', icon: RefreshCw };
                    case 'backup': return { title: 'Download Backup', message: 'Please verify your identity to download the system backup file.', color: 'brand', icon: Download };
                    default: return { title: 'Security Check', message: '', color: 'slate', icon: Lock };
                }
            };
            const content = getModalContent();
            const Icon = content.icon;
            return (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[60] flex items-center justify-center p-4 fade-in">
                    <div className="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden">
                        <div className={`p-6 border-b border-${content.color === 'rose' ? 'red' : 'indigo'}-50 bg-${content.color === 'rose' ? 'red' : 'indigo'}-50/30 flex items-start gap-4`}>
                            <div className={`p-3 bg-white rounded-2xl shadow-sm text-${content.color === 'rose' ? 'red' : 'indigo'}-600`}><Icon size={24} /></div>
                            <div><h3 className={`text-xl font-bold text-slate-900`}>{content.title}</h3><p className={`text-sm text-slate-500 mt-1`}>Security Verification Required</p></div>
                        </div>
                        <div className="p-6">
                            <p className="text-slate-600 mb-6 text-sm leading-relaxed">{content.message}</p>
                            <form onSubmit={handleSubmit} className="space-y-5">
                                <div><label className="block text-sm font-bold text-slate-700 mb-1.5">Confirm Password</label><PasswordInput value={password} onChange={(e) => { setPassword(e.target.value); setError(''); }} className={`w-full px-4 py-3 rounded-xl border focus:ring-2 outline-none transition-all ${error ? 'border-red-300 focus:ring-red-200' : 'border-slate-300 focus:ring-brand-200 focus:border-brand-500'}`} />{error && <p className="text-red-500 text-xs mt-2 font-medium flex items-center gap-1 bg-red-50 p-2 rounded-lg"><ShieldAlert size={12}/> {error}</p>}</div>
                                <div className="flex gap-3 pt-2"><button type="button" onClick={() => { onClose(); setPassword(''); setError(''); }} className="flex-1 px-4 py-3 rounded-xl border border-slate-200 text-slate-600 font-bold hover:bg-slate-50 transition-colors">Cancel</button><button type="submit" className={`flex-1 px-4 py-3 rounded-xl text-white font-bold shadow-lg transition-all active:scale-[0.98] ${content.color === 'rose' ? 'bg-red-600 hover:bg-red-700 shadow-red-200' : 'bg-brand-600 hover:bg-brand-700 shadow-indigo-200'}`}>Confirm & Proceed</button></div>
                            </form>
                        </div>
                    </div>
                </div>
            );
        };

        const SearchableMultiSelect = ({ label, options, selected = [], onChange, disabledOptions = [], restDayUsers = [], busyUsers = [], assignmentCounts = {}, upcomingRestDayUsers = [] }) => {
            const [isOpen, setIsOpen] = React.useState(false);
            const [searchTerm, setSearchTerm] = React.useState('');
            const containerRef = React.useRef(null);
            React.useEffect(() => {
                const handleClickOutside = (event) => { if (containerRef.current && !containerRef.current.contains(event.target)) { setIsOpen(false); setSearchTerm(''); } };
                document.addEventListener("mousedown", handleClickOutside); return () => document.removeEventListener("mousedown", handleClickOutside);
            }, []);
            
            const toggleOption = (optionName) => { 
                if (selected.includes(optionName)) { 
                    onChange(selected.filter(item => item !== optionName)); 
                } else { 
                    onChange([...selected, optionName]); 
                } 
            };
            
            const filteredOptions = options.filter(opt => opt.nickname.toLowerCase().includes(searchTerm.toLowerCase()) || opt.name.toLowerCase().includes(searchTerm.toLowerCase()));
            const safeSelected = Array.isArray(selected) ? selected : (selected ? [selected] : []);
            const displayValue = safeSelected.length > 0 ? safeSelected.map(name => { const opt = options.find(o => o.name === name); return opt ? opt.nickname : name; }).join(', ') : `Select ${label}`;
            
            return (
                <div className="relative" ref={containerRef}>
                    <label className="block text-sm font-bold text-slate-700 mb-1.5">{label}</label>
                    <div onClick={() => setIsOpen(!isOpen)} className="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-500 bg-white cursor-pointer flex justify-between items-center min-h-[48px] hover:border-brand-300 transition-colors shadow-sm"><span className={`text-sm ${safeSelected.length === 0 ? 'text-slate-400' : 'text-slate-800 font-medium'} truncate`}>{displayValue}</span><ChevronDown size={18} className={`text-slate-400 shrink-0 transition-transform duration-200 ${isOpen ? 'rotate-180' : ''}`} /></div>
                    {isOpen && (
                        <div className="absolute z-50 mt-2 w-full bg-white border border-slate-100 rounded-xl shadow-xl max-h-64 overflow-hidden flex flex-col ring-1 ring-black/5 animate-in fade-in zoom-in-95 duration-100">
                            <div className="p-3 border-b border-slate-50 bg-slate-50/50 sticky top-0 z-10"><div className="relative"><Search className="absolute left-3 top-2.5 text-slate-400" size={16} /><input type="text" autoFocus placeholder={`Search ${label}...`} className="w-full pl-10 pr-3 py-2 text-sm border border-slate-200 rounded-lg outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-200 transition-all bg-white" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} onClick={(e) => e.stopPropagation()} /></div></div>
                            <div className="overflow-y-auto custom-scrollbar flex-1 p-1">{filteredOptions.length > 0 ? (filteredOptions.map((option, idx) => { 
                                const isSelected = safeSelected.includes(option.name);
                                const isRestDay = restDayUsers.includes(option.name);
                                const isTaken = disabledOptions.includes(option.name);
                                const isBusy = busyUsers.includes(option.name);
                                const isUpcomingRestDay = upcomingRestDayUsers.includes(option.name);
                                const isDisabled = isRestDay || isTaken || isBusy;
                                const loadCount = assignmentCounts[option.name] || 0; 
                                
                                return ( 
                                    <div key={idx} onClick={() => !isDisabled && toggleOption(option.name)} className={`px-3 py-2.5 mx-1 my-0.5 rounded-lg text-sm flex items-center gap-3 cursor-pointer transition-all ${isDisabled ? 'opacity-50 cursor-not-allowed bg-slate-50 grayscale' : 'hover:bg-brand-50'} ${isSelected ? 'bg-brand-50 ring-1 ring-brand-200' : ''} ${isUpcomingRestDay && !isDisabled ? 'bg-amber-50/80 border border-amber-100' : ''}`}>
                                        <div className={`w-5 h-5 rounded-md border flex items-center justify-center shrink-0 transition-colors ${isSelected ? 'bg-brand-600 border-brand-600 shadow-sm' : 'border-slate-300 bg-white'}`}>{isSelected && <Check size={14} className="text-white" />}</div>
                                        <div className="flex-1">
                                            <div className="font-semibold text-slate-800 flex justify-between items-center">
                                                <span>
                                                    {option.nickname} 
                                                    <span className={`ml-1.5 text-[10px] font-bold px-1.5 py-0.5 rounded-full ${loadCount > 5 ? 'bg-orange-100 text-orange-700' : 'bg-slate-100 text-slate-600'}`} title="Confirmed/Done Assignments (Current Month)">
                                                        {loadCount}
                                                    </span>
                                                </span>
                                                <div className="flex gap-1 flex-wrap justify-end">
                                                    {isRestDay && <span className="text-[10px] bg-orange-100 text-orange-700 font-bold px-1.5 py-0.5 rounded flex items-center gap-1"><Coffee size={10}/> Rest</span>}
                                                    {isBusy && <span className="text-[10px] bg-red-100 text-red-700 font-bold px-1.5 py-0.5 rounded flex items-center gap-1"><CalendarX size={10}/> Busy</span>}
                                                    {isUpcomingRestDay && !isRestDay && <span className="text-[10px] bg-amber-100 text-amber-700 font-bold px-1.5 py-0.5 rounded border border-amber-200" title="User has a Rest Day tomorrow">🌙 Rest Tmrw</span>}
                                                </div>
                                            </div>
                                            <div className="text-xs text-slate-500 mt-0.5 font-medium">{option.role}</div>
                                        </div>
                                    </div> 
                                ); 
                            })) : <div className="px-4 py-8 text-sm text-slate-400 text-center italic flex flex-col items-center"><User size={24} className="mb-2 opacity-20"/>No results found</div>}</div>
                        </div>
                    )}
                </div>
            );
        };

        const ListManager = ({ title, items, onAdd, onDelete }) => {
            const [newItem, setNewItem] = React.useState('');
            const handleAdd = () => { if (newItem.trim()) { onAdd(newItem.trim()); setNewItem(''); } };
            return (
                <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow">
                    <h4 className="font-bold text-slate-800 mb-4 flex items-center gap-2"><div className="w-8 h-8 rounded-lg bg-brand-100 text-brand-600 flex items-center justify-center"><ChevronRight size={18} /></div>{title}</h4>
                    <div className="flex gap-2 mb-4"><input type="text" value={newItem} onChange={(e) => setNewItem(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && handleAdd()} placeholder={`Add ${title}...`} className="flex-1 px-4 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none text-sm bg-slate-50/50 focus:bg-white transition-colors" /><button onClick={handleAdd} className="px-4 py-2 bg-brand-600 text-white font-bold rounded-xl hover:bg-brand-700 transition-colors shadow-sm active:scale-95 transform">Add</button></div>
                    <div className="flex flex-wrap gap-2">{items.map((item, idx) => (<span key={idx} className="group inline-flex items-center gap-2 px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-700 font-medium hover:bg-white hover:border-brand-200 hover:text-brand-700 transition-all shadow-sm">{item}<button onClick={() => onDelete(idx)} className="text-slate-400 hover:text-red-500 opacity-50 group-hover:opacity-100 transition-all"><X size={14} /></button></span>))}{items.length === 0 && <span className="text-slate-400 text-sm italic py-2">No items added yet.</span>}</div>
                </div>
            );
        };

        // --- VIEWS ---

        const TeamMemberModal = ({ isOpen, onClose, onSave, initialData, roles }) => {
            if (!isOpen) return null;
            const [formData, setFormData] = React.useState({ name: '', nickname: '', role: 'Live Operator', password: '', restDays: [] });
            const [showConfirm, setShowConfirm] = React.useState(false);
            const daysOfWeek = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];

            React.useEffect(() => { 
                if (initialData) {
                    let currentRestDays = initialData.restDays || [];
                    if (!currentRestDays.length && initialData.restDay) {
                        currentRestDays = [initialData.restDay];
                    }
                    setFormData({ ...initialData, restDays: currentRestDays }); 
                } else { 
                    setFormData({ name: '', nickname: '', role: 'Live Operator', password: '', restDays: [] }); 
                } 
            }, [initialData, isOpen]);
            
            const toggleDay = (day) => {
                if (formData.restDays.includes(day)) {
                    setFormData({ ...formData, restDays: formData.restDays.filter(d => d !== day) });
                } else {
                    setFormData({ ...formData, restDays: [...formData.restDays, day] });
                }
            };

            const handleSubmit = (e) => { e.preventDefault(); setShowConfirm(true); };
            const handleConfirm = () => { onSave(formData); setShowConfirm(false); };
            
            return (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 fade-in">
                    <div className="bg-white rounded-3xl shadow-2xl w-full max-w-md flex flex-col animate-in fade-in zoom-in-95 duration-200 relative overflow-hidden">
                        <div className="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50/80"><h2 className="text-xl font-bold text-slate-800">{initialData ? 'Edit User' : 'Add New User'}</h2><button onClick={onClose} className="p-2 hover:bg-slate-200 rounded-full text-slate-400 hover:text-slate-600 transition-colors"><X size={20} /></button></div>
                        <form onSubmit={handleSubmit} className="p-6 space-y-5">
                            <div><label className="block text-sm font-bold text-slate-700 mb-1.5">Full Name</label><input required type="text" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} className="w-full px-4 py-3 rounded-xl border border-slate-300 outline-none focus:ring-2 focus:ring-brand-500 bg-slate-50/50 focus:bg-white transition-all" /></div>
                            <div><label className="block text-sm font-bold text-slate-700 mb-1.5">Nickname</label><input required type="text" value={formData.nickname} onChange={e => setFormData({...formData, nickname: e.target.value})} className="w-full px-4 py-3 rounded-xl border border-slate-300 outline-none focus:ring-2 focus:ring-brand-500 bg-slate-50/50 focus:bg-white transition-all" /></div>
                            <div><label className="block text-sm font-bold text-slate-700 mb-1.5">Role</label><select value={formData.role} onChange={e => setFormData({...formData, role: e.target.value})} className="w-full px-4 py-3 rounded-xl border border-slate-300 outline-none focus:ring-2 focus:ring-brand-500 bg-slate-50/50 focus:bg-white transition-all">{roles.map(r => <option key={r} value={r}>{r}</option>)}</select></div>
                            
                            <div>
                                <label className="block text-sm font-bold text-slate-700 mb-2">Rest Days (Multiple)</label>
                                <div className="flex flex-wrap gap-2">
                                    {daysOfWeek.map(day => {
                                        const isSelected = formData.restDays.includes(day);
                                        return (
                                            <button 
                                                key={day} 
                                                type="button"
                                                onClick={() => toggleDay(day)}
                                                className={`px-3 py-2 text-xs font-bold rounded-lg border transition-all ${isSelected ? 'bg-brand-600 text-white border-brand-600 shadow-md transform scale-105' : 'bg-white text-slate-500 border-slate-200 hover:bg-slate-50 hover:border-slate-300'}`}
                                            >
                                                {day.substring(0, 3)}
                                            </button>
                                        );
                                    })}
                                </div>
                                <p className="text-xs text-slate-400 mt-2 font-medium">Selected: {formData.restDays.length > 0 ? formData.restDays.join(', ') : 'None'}</p>
                            </div>

                            <div><label className="block text-sm font-bold text-slate-700 mb-1.5">Password</label><PasswordInput value={formData.password} onChange={e => setFormData({...formData, password: e.target.value})} className="w-full px-4 py-3 rounded-xl border border-slate-300 outline-none focus:ring-2 focus:ring-brand-500 bg-slate-50/50 focus:bg-white transition-all" /></div>
                            <div className="pt-4 flex gap-3"><button type="button" onClick={onClose} className="flex-1 px-4 py-3 rounded-xl border border-slate-200 text-slate-600 font-bold hover:bg-slate-50 transition-colors">Cancel</button><button type="submit" className="flex-1 px-4 py-3 rounded-xl bg-brand-600 text-white font-bold hover:bg-brand-700 shadow-lg shadow-indigo-200 transition-all active:scale-[0.98]">{initialData ? 'Save Changes' : 'Create User'}</button></div>
                        </form>
                        <ConfirmationModal isOpen={showConfirm} onClose={() => setShowConfirm(false)} onConfirm={handleConfirm} title="Save User Details" message={`Are you sure you want to ${initialData ? 'update' : 'create'} this user account?`} />
                    </div>
                </div>
            );
        };

        const LoginScreen = ({ onLogin, adminProfile, team = [] }) => {
            const [username, setUsername] = React.useState('');
            const [password, setPassword] = React.useState('');
            const [error, setError] = React.useState('');
            const handleLogin = (e) => {
                e.preventDefault();
                const adminPass = adminProfile?.password || '123';
                if (username === 'Admin' && password === adminPass) { onLogin({ ...adminProfile, role: 'Super Admin' }); return; }
                const foundUser = team.find(member => (member.nickname.toLowerCase() === username.toLowerCase() || member.name.toLowerCase() === username.toLowerCase()) && member.password === password);
                if (foundUser) onLogin(foundUser); else setError('Invalid credentials');
            };
            return (
                <div className="min-h-screen flex items-center justify-center bg-white p-6">
                    <div className="bg-white p-8 rounded-3xl shadow-xl w-full max-w-md border border-slate-100">
                        <div className="text-center mb-8">
                            <div className="w-24 h-24 mx-auto mb-6 bg-slate-50 rounded-2xl p-2 flex items-center justify-center transform hover:scale-105 transition-transform duration-500 border border-slate-100">
                                <img src="icon-512.png" alt="MCN Tracker Logo" className="w-full h-full object-contain rounded-xl" onError={(e) => {e.target.style.display='none'; e.target.parentElement.innerHTML='<div class="bg-indigo-600 w-full h-full rounded-xl flex items-center justify-center text-white font-bold text-2xl">MCN</div>'}} />
                            </div>
                            <h1 className="text-3xl font-extrabold text-slate-800 tracking-tight">MCN Tracker</h1>
                            <p className="text-slate-500 mt-2 font-medium">Sign in to access the dashboard</p>
                        </div>
                        <form onSubmit={handleLogin} className="space-y-5">
                            <div><label className="block text-sm font-bold text-slate-700 mb-1.5 ml-1">Username / Nickname</label><input type="text" value={username} onChange={e => setUsername(e.target.value)} className="w-full px-5 py-3.5 rounded-xl border border-slate-200 focus:ring-4 focus:ring-brand-100 focus:border-brand-500 outline-none transition-all bg-slate-50/50 focus:bg-white" placeholder="Enter username" /></div>
                            <div><label className="block text-sm font-bold text-slate-700 mb-1.5 ml-1">Password</label><PasswordInput value={password} onChange={e => setPassword(e.target.value)} className="w-full px-5 py-3.5 rounded-xl border border-slate-200 focus:ring-4 focus:ring-brand-100 focus:border-brand-500 outline-none transition-all bg-slate-50/50 focus:bg-white" /></div>
                            {error && <p className="text-red-500 text-sm text-center font-medium bg-red-50 p-2 rounded-lg border border-red-100">{error}</p>}
                            <button type="submit" className="w-full py-4 bg-brand-600 hover:bg-brand-700 text-white rounded-xl font-bold text-lg shadow-lg shadow-brand-500/30 transition-all active:scale-[0.98] mt-2">Sign In</button>
                        </form>
                        <p className="text-center text-xs text-slate-400 mt-8">© 2024 MCN Event Tracker System</p>
                    </div>
                </div>
            );
        };

        const Dashboard = ({ events, team, onUpdateStatus, currentUser }) => {
            const [filterType, setFilterType] = React.useState('current');
            const [selectedMonth, setSelectedMonth] = React.useState(getManilaMonth());
            const today = getManilaToday();
            const isAdmin = checkIsAdmin(currentUser);

            const filteredStatsEvents = React.useMemo(() => {
                if (filterType === 'all') return events;
                let targetMonth, targetYear;
                if (filterType === 'current') {
                    const parts = getManilaMonth().split('-');
                    targetYear = parseInt(parts[0]);
                    targetMonth = parseInt(parts[1]) - 1;
                } else {
                    if (!selectedMonth) return events;
                    const parts = selectedMonth.split('-');
                    targetYear = parseInt(parts[0]);
                    targetMonth = parseInt(parts[1]) - 1; 
                }
                return events.filter(e => {
                    if (!e.date) return false;
                    const d = new Date(e.date);
                    const [y, m, day] = e.date.split('-').map(Number);
                    return (m - 1) === targetMonth && y === targetYear;
                });
            }, [events, filterType, selectedMonth]);

            // --- PERSONAL STATS CALCULATION (UPDATED) ---
            const myStats = React.useMemo(() => {
                if (!currentUser || !currentUser.name || currentUser.role === 'Super Admin') return null;
                
                const myEvents = filteredStatsEvents.filter(e => e.status !== 'Cancelled');
                
                let inCharge = 0;
                let backup = 0;
                let doneCount = 0;
                
                myEvents.forEach(ev => {
                    const icList = Array.isArray(ev.inCharge) ? ev.inCharge : (ev.inCharge ? [ev.inCharge] : []);
                    const bList = Array.isArray(ev.backup) ? ev.backup : (ev.backup ? [ev.backup] : []);
                    
                    if (icList.includes(currentUser.name)) {
                        inCharge++;
                        if (ev.status === 'Done') doneCount++;
                    }
                    if (bList.includes(currentUser.name)) {
                        backup++;
                        if (ev.status === 'Done') doneCount++;
                    }
                });
                
                const total = inCharge + backup;
                const remaining = total - doneCount;
                
                return { inCharge, backup, total, done: doneCount, remaining };
            }, [filteredStatsEvents, currentUser]);

            const stats = React.useMemo(() => {
                return {
                    total: filteredStatsEvents.length,
                    pending: filteredStatsEvents.filter(e => e.status === 'Pending').length,
                    confirm: filteredStatsEvents.filter(e => e.status === 'Confirm').length,
                    done: filteredStatsEvents.filter(e => e.status === 'Done').length,
                    today: events.filter(e => e.date === today)
                };
            }, [filteredStatsEvents, events, today]);

            const todayConfirmed = React.useMemo(() => stats.today.filter(e => e.status === 'Confirm'), [stats.today]);
            const todayPending = React.useMemo(() => stats.today.filter(e => e.status === 'Pending'), [stats.today]);

            const teamPerformanceGroups = React.useMemo(() => {
                if (!team) return [];
                const doneEvents = filteredStatsEvents.filter(e => e.status === 'Done');
                const performanceData = team.map(member => {
                    let icCount = 0; let bCount = 0;
                    doneEvents.forEach(ev => {
                        const icList = Array.isArray(ev.inCharge) ? ev.inCharge : (ev.inCharge ? [ev.inCharge] : []);
                        if (icList.includes(member.name)) icCount++;
                        const bList = Array.isArray(ev.backup) ? ev.backup : (ev.backup ? [ev.backup] : []);
                        if (bList.includes(member.name)) bCount++;
                    });
                    return { ...member, inChargeCount: icCount, backupCount: bCount, total: icCount + bCount };
                });
                const activeMembers = performanceData.filter(m => m.total > 0);
                return groupMembersByRole(activeMembers);
            }, [filteredStatsEvents, team]);

            const assignedStatsGroups = React.useMemo(() => {
                if (!team) return [];
                const ALLOWED_ROLES = ['Live Operator Lead', 'Live Operator Trainer', 'Live Operator'];
                const activeEvents = filteredStatsEvents.filter(e => e.status !== 'Cancelled');
                const eligibleMembers = team.filter(m => ALLOWED_ROLES.includes(m.role));
                const assignmentData = eligibleMembers.map(member => {
                    let inChargeCount = 0; let backupCount = 0;
                    activeEvents.forEach(ev => {
                        const icList = Array.isArray(ev.inCharge) ? ev.inCharge : (ev.inCharge ? [ev.inCharge] : []);
                        const bList = Array.isArray(ev.backup) ? ev.backup : (ev.backup ? [ev.backup] : []);
                        if (icList.includes(member.name)) { inChargeCount++; }
                        if (bList.includes(member.name)) { backupCount++; }
                    });
                    return { ...member, inChargeCount, backupCount, total: inChargeCount + backupCount };
                }).filter(member => member.total > 0);
                return groupMembersByRole(assignmentData);
            }, [filteredStatsEvents, team]);

            const renderNicknames = (data) => {
                if (!data) return '-';
                const list = Array.isArray(data) ? data : [data];
                return list.map(name => getNickname(name, team)).join(', ');
            };

            const handleStatusSelect = (e, eventId) => { onUpdateStatus(eventId, e.target.value); };

            const StatCard = ({ title, count, color, icon: Icon }) => (
                <div className="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm hover:shadow-lg transition-all duration-300 flex items-center justify-between group">
                    <div><p className="text-slate-500 text-sm font-semibold mb-1 uppercase tracking-wider">{title}</p><h3 className="text-4xl font-extrabold text-slate-800">{count}</h3></div>
                    <div className={`p-4 rounded-2xl ${color} group-hover:scale-110 transition-transform duration-300`}><Icon size={28} /></div>
                </div>
            );

            // Responsive Card for Mobile List
            const MobileEventCard = ({ ev }) => (
                <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm mb-4 hover:shadow-md transition-shadow">
                    <div className="flex justify-between items-start mb-4">
                        <div>
                            <p className="text-xs text-slate-500 font-bold mb-1 flex items-center gap-1.5"><Clock size={12} className="text-slate-400"/> {formatDateForDisplay(ev.date, ev.time)}</p>
                            <h4 className="font-extrabold text-slate-800 text-lg leading-tight">{ev.brand}</h4>
                            <p className={`text-xs font-bold mt-1.5 px-2.5 py-0.5 rounded-lg inline-block bg-white border border-slate-100 shadow-sm ${getCompanyColor(ev.company)}`}>{ev.company}</p>
                        </div>
                        <span className={`px-3 py-1 rounded-full text-xs font-bold border shadow-sm ${getStatusColor(ev.status)}`}>{ev.status}</span>
                    </div>
                    <div className="grid grid-cols-2 gap-3 text-sm text-slate-600 mb-4 bg-slate-50/50 p-3 rounded-xl border border-slate-100">
                        <div><span className="text-slate-400 text-[10px] font-bold uppercase block mb-0.5 tracking-wide">Venue</span><span className="font-semibold">{ev.venue}</span></div>
                        <div><span className="text-slate-400 text-[10px] font-bold uppercase block mb-0.5 tracking-wide">Platform</span><span className="font-semibold">{ev.platform || '-'}</span></div>
                        <div><span className="text-slate-400 text-[10px] font-bold uppercase block mb-0.5 tracking-wide">In-Charge</span><span className="font-bold text-brand-600">{renderNicknames(ev.inCharge)}</span></div>
                        <div><span className="text-slate-400 text-[10px] font-bold uppercase block mb-0.5 tracking-wide">Backup</span><span className="font-medium text-slate-700">{renderNicknames(ev.backup)}</span></div>
                    </div>
                    {isAdmin && (
                        <div className="pt-3 border-t border-slate-100 flex justify-between items-center">
                           <select value={ev.status} onChange={(e) => handleStatusSelect(e, ev.id)} className="text-xs bg-slate-50 border border-slate-200 rounded-lg p-2 outline-none font-medium text-slate-600 focus:ring-2 focus:ring-brand-500"><option value="Confirm">Confirm</option><option value="Pending">Pending</option><option value="Cancelled">Cancelled</option><option value="Done">Done</option></select>
                        </div>
                    )}
                </div>
            );

            return (
                <div className="space-y-8 pb-24 sm:pb-8">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-6">
                        <div><h2 className="text-3xl font-extrabold text-slate-800 tracking-tight">Dashboard Overview</h2><p className="text-slate-500 font-medium">Welcome back, {currentUser.nickname}</p></div>
                        <div className="flex flex-wrap items-center gap-3 bg-white p-2 rounded-2xl border border-slate-200 shadow-sm w-full sm:w-auto">
                            <button onClick={() => setFilterType('current')} className={`flex-1 sm:flex-none px-5 py-2.5 text-sm font-bold rounded-xl transition-all ${filterType === 'current' ? 'bg-brand-600 text-white shadow-lg shadow-brand-200' : 'text-slate-500 hover:text-slate-700 hover:bg-slate-50'}`}>Current Month</button>
                            <button onClick={() => setFilterType('all')} className={`flex-1 sm:flex-none px-5 py-2.5 text-sm font-bold rounded-xl transition-all ${filterType === 'all' ? 'bg-brand-600 text-white shadow-lg shadow-brand-200' : 'text-slate-500 hover:text-slate-700 hover:bg-slate-50'}`}>All</button>
                            <div className="h-6 w-px bg-slate-200 mx-1 hidden sm:block"></div>
                            <div className="relative flex items-center w-full sm:w-auto">
                                <CalendarDays size={16} className="absolute left-3 text-slate-400 pointer-events-none" />
                                <input type="month" value={selectedMonth} onChange={(e) => { setSelectedMonth(e.target.value); setFilterType('specific'); }} className={`pl-9 pr-4 py-2.5 text-sm border-none bg-slate-50 rounded-xl outline-none focus:ring-2 focus:ring-brand-500 transition-all w-full sm:w-auto text-slate-700 font-bold ${filterType === 'specific' ? 'bg-brand-50 text-brand-700' : ''}`} />
                            </div>
                        </div>
                    </div>
                    
                    {myStats && (
                        <div className="bg-gradient-to-br from-indigo-600 via-brand-600 to-violet-700 rounded-3xl p-8 text-white shadow-2xl shadow-indigo-200 relative overflow-hidden">
                            <div className="absolute right-0 top-0 opacity-10 transform translate-x-10 -translate-y-10 mix-blend-overlay"><UserCheck size={200} /></div>
                            <div className="absolute left-0 bottom-0 opacity-10 transform -translate-x-10 translate-y-10 mix-blend-overlay"><BarChart2 size={150} /></div>
                            <div className="relative z-10">
                                <div className="flex items-center gap-4 mb-6">
                                    <div className="p-3 bg-white/10 rounded-2xl backdrop-blur-md shadow-inner border border-white/10"><User size={24} /></div>
                                    <div><h3 className="font-bold text-2xl">My Workload</h3><p className="text-indigo-200 text-sm font-medium">Performance Summary</p></div>
                                </div>
                                <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-4">
                                    <div className="bg-white/10 rounded-2xl p-4 backdrop-blur-md border border-white/5 hover:bg-white/20 transition-colors"><p className="text-indigo-200 text-xs font-bold uppercase tracking-wider mb-2">In-Charge</p><p className="text-3xl font-black">{myStats.inCharge}</p></div>
                                    <div className="bg-white/10 rounded-2xl p-4 backdrop-blur-md border border-white/5 hover:bg-white/20 transition-colors"><p className="text-indigo-200 text-xs font-bold uppercase tracking-wider mb-2">Backup</p><p className="text-3xl font-black">{myStats.backup}</p></div>
                                    <div className="bg-white/20 rounded-2xl p-4 backdrop-blur-md border border-white/20 shadow-lg"><p className="text-white text-xs font-bold uppercase tracking-wider mb-2">Total Assigned</p><p className="text-3xl font-black">{myStats.total}</p></div>
                                    <div className="bg-emerald-500/20 rounded-2xl p-4 backdrop-blur-md border border-emerald-400/30 hover:bg-emerald-500/30 transition-colors"><p className="text-emerald-100 text-xs font-bold uppercase tracking-wider mb-2">Completed</p><p className="text-3xl font-black text-emerald-50">{myStats.done}</p></div>
                                    <div className="bg-amber-500/20 rounded-2xl p-4 backdrop-blur-md border border-amber-400/30 hover:bg-amber-500/30 transition-colors"><p className="text-amber-100 text-xs font-bold uppercase tracking-wider mb-2">Remaining</p><p className="text-3xl font-black text-amber-50">{myStats.remaining}</p></div>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                        <StatCard title="Total Events" count={stats.total} color="bg-indigo-50 text-indigo-600" icon={CalendarIcon} />
                        <StatCard title="Pending" count={stats.pending} color="bg-amber-50 text-amber-600" icon={AlertTriangle} />
                        <StatCard title="Confirmed" count={stats.confirm} color="bg-emerald-50 text-emerald-600" icon={Check} />
                        <StatCard title="Done" count={stats.done} color="bg-blue-50 text-blue-600" icon={Briefcase} />
                    </div>
                    {todayPending.length > 0 && (
                        <div className="bg-amber-50 border border-amber-100 rounded-3xl p-6 shadow-sm">
                            <h3 className="text-amber-800 font-bold flex items-center gap-2 mb-4 text-lg"><AlertCircle size={24} /> Action Required: Pending (Today)</h3>
                            <div className="overflow-x-auto bg-white rounded-2xl border border-amber-100 shadow-sm">
                                <table className="w-full text-left text-sm">
                                    <thead className="bg-amber-50 text-amber-800 font-bold uppercase text-xs tracking-wider"><tr><th className="px-6 py-4">Time</th><th className="px-6 py-4">Brand</th><th className="px-6 py-4">In-Charge</th><th className="px-6 py-4">Status</th></tr></thead>
                                    <tbody className="divide-y divide-amber-50">
                                        {todayPending.map(ev => (
                                            <tr key={ev.id}>
                                                <td className="px-6 py-4 font-mono font-medium text-slate-600">{ev.time}</td><td className="px-6 py-4 font-bold text-slate-800">{ev.brand}</td><td className="px-6 py-4 font-medium">{renderNicknames(ev.inCharge)}</td>
                                                <td className="px-6 py-4"><select value={ev.status} onChange={(e) => handleStatusSelect(e, ev.id)} disabled={!isAdmin} className={`px-3 py-1.5 rounded-lg text-xs font-bold outline-none border border-amber-200 bg-amber-50 text-amber-700 cursor-pointer hover:bg-amber-100`}><option value="Confirm">Confirm</option><option value="Pending">Pending</option><option value="Cancelled">Cancelled</option></select></td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}
                    
                    <div className="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
                        <div className="p-6 border-b border-slate-100 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 bg-slate-50/50"><h3 className="text-lg font-bold text-slate-800 flex items-center gap-3"><div className="p-2 bg-white rounded-xl shadow-sm text-brand-600"><CalendarIcon size={20} /></div> Happening Today (Confirmed)</h3><span className="text-sm font-semibold text-slate-500 bg-white px-3 py-1 rounded-lg border border-slate-200">{new Date(today).toDateString()}</span></div>
                        <div className="p-6 sm:p-0">
                            <div className="block sm:hidden space-y-4">
                                {todayConfirmed.length > 0 ? todayConfirmed.map(ev => <MobileEventCard key={ev.id} ev={ev} />) : <div className="text-center text-slate-400 text-sm py-8 font-medium">No confirmed events for today.</div>}
                            </div>
                            <div className="hidden sm:block overflow-x-auto">
                                <table className="w-full text-left text-sm">
                                    <thead className="bg-slate-50 text-slate-500 font-semibold uppercase text-xs tracking-wider"><tr><th className="px-6 py-4">Time</th><th className="px-6 py-4">Brand</th><th className="px-6 py-4">Venue</th><th className="px-6 py-4">In-Charge</th><th className="px-6 py-4">Backup</th><th className="px-6 py-4">Status</th></tr></thead>
                                    <tbody className="divide-y divide-slate-100">
                                        {todayConfirmed.map(ev => (
                                            <tr key={ev.id} className="hover:bg-slate-50/80">
                                                <td className="px-6 py-4 font-mono font-medium text-slate-600 whitespace-nowrap">{ev.time}</td>
                                                <td className="px-6 py-4 font-bold text-slate-800">{ev.brand}</td>
                                                <td className="px-6 py-4 text-slate-600">{ev.venue}</td>
                                                <td className="px-6 py-4 max-w-[180px] truncate font-medium text-brand-600" title={renderNicknames(ev.inCharge)}>{renderNicknames(ev.inCharge)}</td>
                                                <td className="px-6 py-4 text-slate-500 max-w-[180px] truncate" title={renderNicknames(ev.backup)}>{renderNicknames(ev.backup)}</td>
                                                <td className="px-6 py-4"><select value={ev.status} onChange={(e) => handleStatusSelect(e, ev.id)} disabled={!isAdmin} className={`px-3 py-1.5 rounded-lg text-xs font-bold outline-none border transition-all ${isAdmin ? 'cursor-pointer hover:scale-105' : 'cursor-not-allowed opacity-80'} ${getStatusColor(ev.status)}`}><option value="Confirm">Confirm</option><option value="Pending">Pending</option><option value="Cancelled">Cancelled</option><option value="Done">Done</option></select></td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                    {/* Team Perf and Assigned Stats Tables Omitted for Brevity - they use same overflow-x-auto pattern */}
                    <div className="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
                        <div className="p-6 border-b border-slate-100 bg-slate-50/50"><h3 className="text-lg font-bold text-slate-800 flex items-center gap-3"><div className="p-2 bg-white rounded-xl shadow-sm text-brand-600"><Users size={20} /></div> Team Performance (Done Events)</h3></div>
                        <div className="overflow-x-auto"><table className="w-full text-left text-sm whitespace-nowrap"><thead className="bg-slate-50 text-slate-500 font-semibold uppercase text-xs tracking-wider"><tr><th className="px-6 py-4">Full Name</th><th className="px-6 py-4">Nickname</th><th className="px-6 py-4">Role</th><th className="px-6 py-4 text-center">In-Charge</th><th className="px-6 py-4 text-center">Backup</th><th className="px-6 py-4 text-center">Total</th></tr></thead><tbody className="divide-y divide-slate-100">{teamPerformanceGroups.map((group) => (<React.Fragment key={group.role}><tr className="bg-slate-50/50"><td colSpan="6" className="font-bold text-slate-700 px-6 py-3 border-b border-slate-200 text-xs uppercase tracking-wide">{group.role}</td></tr>{group.members.map((member, idx) => (<tr key={`${group.role}-${idx}`} className="hover:bg-slate-50"><td className="px-6 py-4 font-medium text-slate-800">{member.name}</td><td className="px-6 py-4 text-slate-600">{member.nickname}</td><td className="px-6 py-4 text-slate-500 text-xs bg-slate-100 rounded-lg inline-block my-3 mx-6 py-1 px-2">{member.role}</td><td className="px-6 py-4 text-center font-bold text-brand-600 text-lg">{member.inChargeCount}</td><td className="px-6 py-4 text-center font-bold text-slate-600 text-lg">{member.backupCount}</td><td className="px-6 py-4 text-center font-black text-slate-800 text-lg">{member.total}</td></tr>))}</React.Fragment>))}{teamPerformanceGroups.length === 0 && <tr><td colSpan="6" className="p-8 text-center text-slate-400 font-medium italic">No active team members for this period.</td></tr>}</tbody></table></div>
                    </div>
                    <div className="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
                        <div className="p-6 border-b border-slate-100 bg-slate-50/50"><h3 className="text-lg font-bold text-slate-800 flex items-center gap-3"><div className="p-2 bg-white rounded-xl shadow-sm text-brand-600"><Briefcase size={20} /></div> Assigned Event Counter</h3></div>
                        <div className="overflow-x-auto"><table className="w-full text-left text-sm whitespace-nowrap"><thead className="bg-slate-50 text-slate-500 font-semibold uppercase text-xs tracking-wider"><tr><th className="px-6 py-4">Full Name</th><th className="px-6 py-4">Nickname</th><th className="px-6 py-4">Role</th><th className="px-6 py-4 text-center">In-Charge</th><th className="px-6 py-4 text-center">Backup</th><th className="px-6 py-4 text-center">Total Assigned</th></tr></thead><tbody className="divide-y divide-slate-100">{assignedStatsGroups.map((group) => (<React.Fragment key={group.role}><tr className="bg-slate-50/50"><td colSpan="6" className="font-bold text-slate-700 px-6 py-3 border-b border-slate-200 text-xs uppercase tracking-wide">{group.role}</td></tr>{group.members.map((member, idx) => (<tr key={`${group.role}-${idx}`} className="hover:bg-slate-50"><td className="px-6 py-4 font-medium text-slate-800">{member.name}</td><td className="px-6 py-4 text-slate-600">{member.nickname}</td><td className="px-6 py-4 text-slate-500 text-xs bg-slate-100 rounded-lg inline-block my-3 mx-6 py-1 px-2">{member.role}</td><td className="px-6 py-4 text-center font-bold text-brand-600 text-lg">{member.inChargeCount}</td><td className="px-6 py-4 text-center font-bold text-slate-600 text-lg">{member.backupCount}</td><td className="px-6 py-4 text-center font-black text-slate-800 text-lg">{member.total}</td></tr>))}</React.Fragment>))}{assignedStatsGroups.length === 0 && <tr><td colSpan="6" className="p-8 text-center text-slate-400 font-medium italic">No data available.</td></tr>}</tbody></table></div>
                    </div>
                </div>
            );
        };

        const EventsView = ({ events, team, companies, onAdd, onEdit, onDelete, currentUser }) => {
            const [search, setSearch] = React.useState('');
            const [filterType, setFilterType] = React.useState('current'); 
            const [selectedMonth, setSelectedMonth] = React.useState(getManilaMonth());
            const [statusFilters, setStatusFilters] = React.useState(['Confirm']); 
            const [companyFilter, setCompanyFilter] = React.useState('All'); 
            const isAdmin = checkIsAdmin(currentUser);

            const filteredEvents = React.useMemo(() => {
                let result = [...events]; 
                
                // 1. Status Filter (Multi-select)
                if (statusFilters.length > 0) { 
                    result = result.filter(e => statusFilters.includes(e.status)); 
                }

                // 2. Company Filter
                if (companyFilter !== 'All') {
                    result = result.filter(e => e.company === companyFilter);
                }

                // 3. Time Filter
                if (filterType !== 'all') {
                    let targetMonth, targetYear;
                    if (filterType === 'current') { const parts = getManilaMonth().split('-'); targetYear = parseInt(parts[0]); targetMonth = parseInt(parts[1]) - 1; }
                    else { if (selectedMonth) { const parts = selectedMonth.split('-'); targetYear = parseInt(parts[0]); targetMonth = parseInt(parts[1]) - 1; } }
                    
                    if (targetYear !== undefined && targetMonth !== undefined) { 
                        result = result.filter(e => { 
                            if (!e.date) return false; 
                            const [y, m, d] = e.date.split('-').map(Number); 
                            return (m - 1) === targetMonth && y === targetYear; 
                        }); 
                    }
                }

                // 4. Search Filter
                if (search) { const lowerSearch = search.toLowerCase(); result = result.filter(e => e.brand.toLowerCase().includes(lowerSearch) || e.company.toLowerCase().includes(lowerSearch) || e.platform?.toLowerCase().includes(lowerSearch) || (e.creator && getNickname(e.creator, team).toLowerCase().includes(lowerSearch)) || (e.inCharge && (Array.isArray(e.inCharge) ? e.inCharge.some(p => p.toLowerCase().includes(lowerSearch)) : e.inCharge.toLowerCase().includes(lowerSearch)))); }
                
                // 5. Robust Chronological Sort
                result.sort((a, b) => {
                    if (!a.date) return 1;
                    if (!b.date) return -1;
                    const dateA = new Date(`${a.date}T${a.time || '00:00'}`);
                    const dateB = new Date(`${b.date}T${b.time || '00:00'}`);
                    if (!isNaN(dateA) && !isNaN(dateB)) { return dateA - dateB; }
                    const strA = `${a.date} ${a.time || ''}`;
                    const strB = `${b.date} ${b.time || ''}`;
                    return strA.localeCompare(strB);
                });

                return result;
            }, [events, search, filterType, selectedMonth, team, statusFilters, companyFilter]);

            const toggleStatusFilter = (tabLabel) => {
                const statusVal = tabLabel === 'Confirmed' ? 'Confirm' : tabLabel;
                if (statusFilters.includes(statusVal)) {
                    setStatusFilters(statusFilters.filter(s => s !== statusVal));
                } else {
                    setStatusFilters([...statusFilters, statusVal]);
                }
            };

            const renderNicknames = (data) => { if (!data) return '-'; const list = Array.isArray(data) ? data : [data]; return list.map(name => getNickname(name, team)).join(', '); };
            const tabs = ['Confirmed', 'Pending', 'Cancelled', 'Done'];

            // Responsive Card for Event List
            const MobileEventCard = ({ ev }) => {
                const isAssigned = currentUser && (
                    (Array.isArray(ev.inCharge) && ev.inCharge.includes(currentUser.name)) ||
                    (Array.isArray(ev.backup) && ev.backup.includes(currentUser.name))
                );

                return (
                    <div className={`p-5 rounded-2xl border shadow-sm mb-4 transition-all ${isAssigned ? 'bg-indigo-50/80 border-indigo-200 ring-1 ring-indigo-200 shadow-indigo-100' : 'bg-white border-slate-200 hover:shadow-md'}`}>
                        <div className="flex justify-between items-start mb-4">
                            <div>
                                <p className="text-xs text-slate-500 font-bold mb-1 flex items-center gap-1.5"><Clock size={12} className="text-slate-400"/> {formatDateForDisplay(ev.date, ev.time)}</p>
                                <h4 className="font-extrabold text-slate-800 text-lg leading-tight">{ev.brand}</h4>
                                <p className={`text-xs font-bold mt-1.5 px-2.5 py-0.5 rounded-lg inline-block bg-white border border-slate-100 shadow-sm ${getCompanyColor(ev.company)}`}>{ev.company}</p>
                            </div>
                            <span className={`px-3 py-1 rounded-full text-xs font-bold border shadow-sm ${getStatusColor(ev.status)}`}>{ev.status}</span>
                        </div>
                        <div className="grid grid-cols-2 gap-3 text-sm text-slate-600 mb-4 bg-slate-50/50 p-3 rounded-xl border border-slate-100">
                            <div><span className="text-slate-400 text-[10px] font-bold uppercase block mb-0.5 tracking-wide">Venue</span><span className="font-semibold">{ev.venue}</span></div>
                            <div><span className="text-slate-400 text-[10px] font-bold uppercase block mb-0.5 tracking-wide">Platform</span><span className="font-semibold">{ev.platform || '-'}</span></div>
                            <div><span className="text-slate-400 text-[10px] font-bold uppercase block mb-0.5 tracking-wide">In-Charge</span><span className="font-bold text-brand-600">{renderNicknames(ev.inCharge)}</span></div>
                            <div><span className="text-slate-400 text-[10px] font-bold uppercase block mb-0.5 tracking-wide">Backup</span><span className="font-medium text-slate-700">{renderNicknames(ev.backup)}</span></div>
                        </div>
                        {isAdmin && (
                            <div className="pt-4 border-t border-slate-200/50 flex justify-end gap-3">
                                <button onClick={() => onEdit(ev)} className="px-4 py-2 bg-indigo-50 text-indigo-600 text-xs font-bold rounded-lg hover:bg-indigo-100 transition-colors flex items-center gap-1"><Edit2 size={12}/> Edit</button>
                                <button onClick={() => onDelete(ev.id)} className="px-4 py-2 bg-rose-50 text-rose-600 text-xs font-bold rounded-lg hover:bg-rose-100 transition-colors flex items-center gap-1"><Trash2 size={12}/> Delete</button>
                            </div>
                        )}
                    </div>
                );
            };

            return (
                <div className="space-y-8 pb-24 sm:pb-8">
                    <div className="flex flex-col gap-6">
                        <div className="flex flex-col xl:flex-row justify-between items-start xl:items-center gap-4">
                            <h2 className="text-3xl font-extrabold text-slate-800 tracking-tight">Event Schedule</h2>
                            <div className="flex flex-col sm:flex-row gap-3 w-full xl:w-auto">
                                <div className="flex flex-wrap items-center gap-2 bg-white p-1.5 rounded-xl border border-slate-200 shadow-sm w-full sm:w-auto">
                                    <button onClick={() => setFilterType('current')} className={`flex-1 sm:flex-none px-4 py-2 text-sm font-bold rounded-lg transition-all ${filterType === 'current' ? 'bg-brand-600 text-white shadow-lg shadow-brand-200' : 'text-slate-500 hover:text-slate-700 hover:bg-slate-50'}`}>Current Month</button>
                                    <button onClick={() => setFilterType('all')} className={`flex-1 sm:flex-none px-4 py-2 text-sm font-bold rounded-lg transition-all ${filterType === 'all' ? 'bg-brand-600 text-white shadow-lg shadow-brand-200' : 'text-slate-500 hover:text-slate-700 hover:bg-slate-50'}`}>All</button>
                                    <div className="h-6 w-px bg-slate-200 mx-1 hidden sm:block"></div>
                                    <div className="relative flex items-center w-full sm:w-auto">
                                        <CalendarDays size={16} className="absolute left-3 text-slate-400 pointer-events-none" />
                                        <input type="month" value={selectedMonth} onChange={(e) => { setSelectedMonth(e.target.value); setFilterType('specific'); }} className={`pl-9 pr-3 py-2 text-sm bg-slate-50 border-none rounded-lg outline-none focus:ring-2 focus:ring-brand-500 transition-all w-full sm:w-32 font-bold text-slate-700 ${filterType === 'specific' ? 'bg-brand-50 text-brand-700' : ''}`} />
                                    </div>
                                </div>
                                <div className="flex flex-col sm:flex-row gap-2 flex-1 w-full sm:w-auto">
                                    {/* Company Filter Dropdown */}
                                    <div className="relative w-full sm:w-48">
                                        <select
                                            value={companyFilter}
                                            onChange={(e) => setCompanyFilter(e.target.value)}
                                            className="w-full pl-3 pr-8 py-2.5 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none text-sm font-semibold text-slate-700 shadow-sm appearance-none"
                                        >
                                            <option value="All">All Companies</option>
                                            {companies.map(c => <option key={c} value={c}>{c}</option>)}
                                        </select>
                                        <ChevronDown size={16} className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none" />
                                    </div>

                                    <div className="relative flex-1 sm:w-64"><Search className="absolute left-3 top-2.5 text-slate-400" size={18} /><input type="text" placeholder="Search events..." value={search} onChange={e => setSearch(e.target.value)} className="w-full pl-10 pr-4 py-2.5 bg-white rounded-xl border border-slate-200 focus:ring-2 focus:ring-brand-500 outline-none shadow-sm transition-all text-sm font-medium" /></div>
                                    {isAdmin && <button onClick={onAdd} className="flex items-center justify-center gap-2 bg-slate-900 text-white px-5 py-2.5 rounded-xl hover:bg-slate-800 transition-all shadow-lg hover:shadow-xl active:scale-95 font-bold text-sm"><Plus size={18} /> <span className="hidden sm:inline">Add Event</span></button>}
                                </div>
                            </div>
                        </div>
                        <div className="flex gap-2 border-b border-slate-200 overflow-x-auto pb-1 custom-scrollbar">
                            <button 
                                onClick={() => setStatusFilters([])} 
                                className={`px-5 py-2.5 text-sm font-bold whitespace-nowrap transition-all border-b-2 ${statusFilters.length === 0 ? 'border-brand-600 text-brand-600 bg-brand-50/50' : 'border-transparent text-slate-500 hover:text-slate-800 hover:bg-slate-50 hover:border-slate-300'}`}
                            >
                                All
                            </button>
                            {tabs.map((tab) => {
                                const statusVal = tab === 'Confirmed' ? 'Confirm' : tab;
                                const isActive = statusFilters.includes(statusVal);
                                return (
                                    <button 
                                        key={tab} 
                                        onClick={() => toggleStatusFilter(tab)} 
                                        className={`px-5 py-2.5 text-sm font-bold whitespace-nowrap transition-all border-b-2 ${isActive ? 'border-brand-600 text-brand-600 bg-brand-50/50' : 'border-transparent text-slate-500 hover:text-slate-800 hover:bg-slate-50 hover:border-slate-300'}`}
                                    >
                                        {tab}
                                    </button>
                                );
                            })}
                        </div>
                    </div>
                    
                    {/* Events List Container */}
                    <div className="bg-white sm:rounded-3xl sm:border border-slate-200 sm:shadow-sm overflow-hidden bg-transparent sm:bg-white">
                         {/* Mobile View */}
                         <div className="block sm:hidden">
                            {filteredEvents.length > 0 ? filteredEvents.map(ev => <MobileEventCard key={ev.id} ev={ev} />) : <div className="p-12 text-center flex flex-col items-center justify-center text-slate-400"><CalendarX size={48} className="mb-3 opacity-20"/> <span className="font-medium">No events found matching your criteria.</span></div>}
                         </div>

                         {/* Desktop View */}
                        <div className="hidden sm:block overflow-x-auto">
                            <table className="w-full text-left text-sm">
                                <thead className="bg-slate-50/80 text-slate-500 font-semibold border-b border-slate-200 uppercase text-xs tracking-wider backdrop-blur-sm">
                                    <tr>
                                        <th className="px-4 py-4 whitespace-nowrap">Date & Time</th>
                                        <th className="px-4 py-4 whitespace-nowrap">Day</th>
                                        <th className="px-4 py-4 whitespace-nowrap">Status</th>
                                        <th className="px-4 py-4 whitespace-nowrap">Company</th>
                                        <th className="px-4 py-4 whitespace-nowrap">Platform</th>
                                        <th className="px-4 py-4 min-w-[120px]">Brand</th>
                                        <th className="px-4 py-4 min-w-[100px]">Creator</th>
                                        <th className="px-4 py-4 min-w-[100px]">Venue</th>
                                        <th className="px-4 py-4 min-w-[80px]">Setup</th>
                                        <th className="px-4 py-4 min-w-[140px]">In-Charge</th>
                                        <th className="px-4 py-4 min-w-[140px]">Backup</th>
                                        {isAdmin && <th className="px-4 py-4 text-right whitespace-nowrap">Actions</th>}
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100">
                                    {filteredEvents.map((ev) => {
                                        const isAssigned = currentUser && (
                                            (Array.isArray(ev.inCharge) && ev.inCharge.includes(currentUser.name)) ||
                                            (Array.isArray(ev.backup) && ev.backup.includes(currentUser.name))
                                        );

                                        return (
                                        <tr key={ev.id} className={`hover:bg-slate-50/80 transition-colors ${isAssigned ? 'bg-indigo-50/60' : ''}`}>
                                            <td className="px-4 py-4 text-slate-700 whitespace-nowrap font-mono font-medium align-top">{formatDateForDisplay(ev.date, ev.time)}</td>
                                            <td className="px-4 py-4 text-slate-500 whitespace-nowrap font-medium align-top">{getDayName(ev.date)}</td>
                                            <td className="px-4 py-4 align-top"><span className={`px-2.5 py-0.5 rounded-full text-xs font-bold border shadow-sm ${getStatusColor(ev.status)}`}>{ev.status}</span></td>
                                            <td className="px-4 py-4 align-top"><span className={`font-bold ${getCompanyColor(ev.company)}`}>{ev.company}</span></td>
                                            <td className="px-4 py-4 font-medium text-slate-600 whitespace-nowrap align-top">{ev.platform || '-'}</td>
                                            <td className="px-4 py-4 font-bold text-slate-800 break-words align-top">{ev.brand}</td>
                                            <td className="px-4 py-4 text-slate-600 font-medium break-words align-top">{getNickname(ev.creator, team)}</td>
                                            <td className="px-4 py-4 text-slate-600 break-words align-top">{ev.venue}</td>
                                            <td className="px-4 py-4 text-slate-600 break-words align-top">{ev.setup}</td>
                                            <td className="px-4 py-4 text-brand-600 font-bold break-words align-top leading-snug">{renderNicknames(ev.inCharge)}</td>
                                            <td className="px-4 py-4 text-slate-500 font-medium text-xs break-words align-top leading-snug">{renderNicknames(ev.backup)}</td>
                                            {isAdmin && <td className="px-4 py-4 text-right whitespace-nowrap align-top"><div className="flex justify-end gap-2"><button onClick={() => onEdit(ev)} className="p-2 text-slate-400 hover:text-brand-600 hover:bg-brand-50 rounded-lg transition-all"><Edit2 size={16} /></button><button onClick={() => onDelete(ev.id)} className="p-2 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition-all"><Trash2 size={16} /></button></div></td>}
                                        </tr>
                                    )})}
                                    {filteredEvents.length === 0 && <tr><td colSpan={isAdmin ? "12" : "11"} className="px-6 py-12 text-center text-slate-400 font-medium italic">No events found matching your criteria.</td></tr>}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        const ReportsView = ({ events, team, companies }) => {
            const [selectedCompany, setSelectedCompany] = React.useState('All');
            const [reportType, setReportType] = React.useState('monthly'); 
            const [selectedDate, setSelectedDate] = React.useState(getManilaMonth()); 
            const [selectedYear, setSelectedYear] = React.useState(new Date().getFullYear().toString());

            const generateReport = () => {
                let reportEvents = events.filter(e => e.status === 'Done');
                if (selectedCompany !== 'All') { reportEvents = reportEvents.filter(e => e.company === selectedCompany); }
                if (reportType === 'monthly') { const [year, month] = selectedDate.split('-'); reportEvents = reportEvents.filter(e => { const d = new Date(e.date); return d.getFullYear() === parseInt(year) && d.getMonth() === parseInt(month) - 1; }); } 
                else if (reportType === 'yearly') { reportEvents = reportEvents.filter(e => new Date(e.date).getFullYear() === parseInt(selectedYear)); }

                const ALLOWED_ROLES = ['Live Operator Lead', 'Live Operator Trainer', 'Live Operator'];
                const activeReportEvents = reportEvents.filter(e => e.status !== 'Cancelled');
                const eligibleMembers = team.filter(m => ALLOWED_ROLES.includes(m.role));
                const assignmentData = eligibleMembers.map(member => {
                    let inChargeCount = 0; let backupCount = 0;
                    activeReportEvents.forEach(ev => {
                        const icList = Array.isArray(ev.inCharge) ? ev.inCharge : (ev.inCharge ? [ev.inCharge] : []);
                        const bList = Array.isArray(ev.backup) ? ev.backup : (ev.backup ? [ev.backup] : []);
                        if (icList.includes(member.name)) inChargeCount++;
                        if (bList.includes(member.name)) backupCount++;
                    });
                    return { ...member, inChargeCount, backupCount, total: inChargeCount + backupCount };
